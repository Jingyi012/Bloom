name: Verify Bloom Mobile

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/verify-mobile.yml"
      - ".github/workflows/build-mobile-android.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/verify-mobile.yml"
      - ".github/workflows/build-mobile-android.yml"

permissions:
  contents: read

concurrency:
  group: verify-bloom-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check and bundle Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_NO_DOTENV: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Verify Android bundle
        run: npx expo export --platform android --output-dir dist-ci
