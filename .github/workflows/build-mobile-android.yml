name: Build Bloom Android APK

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "GitHub Environment containing the mobile build secrets"
        required: true
        default: uat
        type: choice
        options:
          - uat
          - prod

permissions:
  contents: write

concurrency:
  group: build-bloom-android-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build ${{ inputs.target_env }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.target_env }}
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ secrets.BLOOM_MOBILE_API_URL }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.BLOOM_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.BLOOM_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.BLOOM_GOOGLE_WEB_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Validate build secrets
        shell: bash
        run: |
          test -n "$EXPO_TOKEN" || { echo "EXPO_TOKEN is required"; exit 1; }
          test -n "$EXPO_PUBLIC_API_URL" || { echo "BLOOM_MOBILE_API_URL is required"; exit 1; }
          test -n "$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID" || { echo "BLOOM_GOOGLE_ANDROID_CLIENT_ID is required"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Type-check mobile app
        run: npm run typecheck

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 22.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Sync mobile variables to EAS
        shell: bash
        env:
          EAS_TARGET_ENV: ${{ inputs.target_env }}
        run: |
          if [[ "$EAS_TARGET_ENV" == "prod" ]]; then
            EAS_ENVIRONMENT="production"
          else
            EAS_ENVIRONMENT="preview"
          fi

          set_eas_variable() {
            local name="$1"
            local value="$2"
            if [[ -n "$value" ]]; then
              eas env:set \
                --name "$name" \
                --value "$value" \
                --environment "$EAS_ENVIRONMENT" \
                --visibility plaintext \
                --non-interactive
            fi
          }

          set_eas_variable EXPO_PUBLIC_API_URL "$EXPO_PUBLIC_API_URL"
          set_eas_variable EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID "$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID"
          set_eas_variable EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID "$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID"
          set_eas_variable EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID"
          echo "EAS environment configured: $EAS_ENVIRONMENT"

      - name: Build APK with EAS
        env:
          EAS_TARGET_ENV: ${{ inputs.target_env }}
        run: |
          if [[ "$EAS_TARGET_ENV" == "prod" ]]; then
            EAS_PROFILE="production-apk"
          else
            EAS_PROFILE="preview"
          fi
          if ! eas build --platform android --profile "$EAS_PROFILE" --non-interactive --wait --json > eas-build.json 2> eas-build.log; then
            echo "EAS build failed. Diagnostic output:"
            cat eas-build.log || true
            cat eas-build.json || true
            exit 1
          fi

      - name: Resolve build metadata
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.target_env }}
        run: |
          node <<'NODE'
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync("eas-build.json", "utf8"));
            const build = Array.isArray(payload) ? payload[0] : payload;
            const url = build?.artifacts?.buildUrl;
            if (!url) throw new Error("EAS did not return an APK URL");
            const appVersion = String(build?.appVersion || "");
            const appBuildVersion = String(build?.appBuildVersion || "");
            if (!/^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$/.test(appVersion)) {
              throw new Error(`EAS returned an invalid app version: ${appVersion || "<empty>"}`);
            }
            if (!/^\d+$/.test(appBuildVersion)) {
              throw new Error(`EAS returned an invalid Android build version: ${appBuildVersion || "<empty>"}`);
            }
            const targetEnv = process.env.TARGET_ENV;
            const releaseTag = `mobile-${targetEnv}-v${appVersion}-build.${appBuildVersion}`;
            const apkFile = `bloom-${targetEnv}-v${appVersion}-build.${appBuildVersion}.apk`;
            const values = {
              APP_VERSION: appVersion,
              APP_BUILD_VERSION: appBuildVersion,
              EAS_BUILD_ID: String(build.id || ""),
              APK_URL: url,
              APK_FILE: apkFile,
              RELEASE_TAG: releaseTag,
            };
            fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(values)
              .map(([key, value]) => `${key}=${value}\n`).join(""));
          NODE

      - name: Download APK
        shell: bash
        run: |
          curl --fail --location --retry 3 "$APK_URL" --output "$APK_FILE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloom-${{ inputs.target_env }}-v${{ env.APP_VERSION }}-build-${{ env.APP_BUILD_VERSION }}-apk
          path: apps/mobile/${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Bloom Android v${{ env.APP_VERSION }} (${{ inputs.target_env }} build ${{ env.APP_BUILD_VERSION }})
          prerelease: ${{ inputs.target_env != 'prod' }}
          generate_release_notes: true
          files: apps/mobile/${{ env.APK_FILE }}
          body: |
            Environment: `${{ inputs.target_env }}`
            App version: `${{ env.APP_VERSION }}`
            Android version code: `${{ env.APP_BUILD_VERSION }}`
            EAS build ID: `${{ env.EAS_BUILD_ID }}`
