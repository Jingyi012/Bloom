services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - "${POSTGRES_DATA_PATH}:/var/lib/postgresql/data"
    ports:
      - "${DB_BIND_HOST}:${DB_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/${IMAGE_OWNER}/bloom-backend:${BACKEND_IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ConnectionStrings__BloomDb: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${API_BIND_HOST}:${API_HOST_PORT}:8080"
    volumes:
      - ${BLOOM_UPLOADS_PATH}:/data/uploads
      - bloom_keys:/app/App_Data/keys
    depends_on:
      db:
        condition: service_healthy

volumes:
  bloom_keys:
